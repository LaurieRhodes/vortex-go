version: "2"
linters:
  enable:
    - misspell
  disable:
    - depguard
    - exhaustive
    - wrapcheck
  settings:
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprintf
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - unused
        path: benchmark/
    paths:
      - internal/flatbuf
      - internal/proto
      - testdata/testgen
      - .venv
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - internal/flatbuf
      - internal/proto
      - testdata/testgen
      - .venv
      - third_party$
      - builtin$
      - examples$
