# golangci-lint configuration for vortex-go
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - gosimple
    - unused
    - errcheck
    - ineffassign
    - gofmt
    - misspell
  disable:
    - depguard
    - exhaustive
    - wrapcheck

issues:
  exclude-dirs:
    - internal/flatbuf
    - internal/proto
    - testdata/testgen
    - .venv
  exclude-rules:
    # Allow unchecked errors in test files (common pattern)
    - path: _test\.go
      linters:
        - errcheck
    # Allow unused parameters in benchmark code
    - path: benchmark/
      linters:
        - unused
  max-issues-per-linter: 50
  max-same-issues: 10

linters-settings:
  errcheck:
    # Don't check for unchecked errors from fmt.Print/Printf/Println
    exclude-functions:
      - fmt.Print
      - fmt.Printf
      - fmt.Println
      - fmt.Fprintf
  misspell:
    locale: US
