name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        run: go test ./... -count=1 -timeout 300s

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi

            for cmd in vtxinfo vtxconvert; do
              output="dist/${cmd}-${GOOS}-${GOARCH}${ext}"
              echo "Building ${output}..."
              GOOS=$GOOS GOARCH=$GOARCH go build \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "$output" \
                "./cmd/${cmd}"
            done
          done

          cd dist && sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
          body: |
            ## vortex-go ${{ steps.version.outputs.tag }}

            Native Go implementation of the [Vortex columnar file format](https://vortex.dev/).

            ### CLI Tools

            | Binary | Description |
            |--------|-------------|
            | `vtxinfo` | Inspect Vortex file structure, schema, encodings, and statistics |
            | `vtxconvert` | Convert Parquet files to Vortex format |

            ### Installation

            **As a Go library:**
            ```bash
            go get github.com/LaurieRhodes/vortex-go@${{ steps.version.outputs.tag }}
            ```

            **CLI tools:**
            Download binaries below, or:
            ```bash
            go install github.com/LaurieRhodes/vortex-go/cmd/vtxinfo@${{ steps.version.outputs.tag }}
            go install github.com/LaurieRhodes/vortex-go/cmd/vtxconvert@${{ steps.version.outputs.tag }}
            ```

            See [CHANGELOG.md](CHANGELOG.md) for details.
